<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QueryMate</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="container">
    <h1>QueryMate</h1>
    <p>Convert Text to SQL Instantly</p>

    <textarea id="queryInput" placeholder="Example: Show students with marks above 80"></textarea>

    <button onclick="generateSQL()">Generate SQL</button>

    <div class="box">
        <h3>Generated SQL</h3>
        <pre id="sqlOutput"></pre>
    </div>

    <div class="box">
        <h3>Results</h3>
        <table id="resultTable"></table>
    </div>
</div>

<script src="/static/script.js"></script>
</body>
</html>
